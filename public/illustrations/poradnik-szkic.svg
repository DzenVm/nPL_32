<svg viewBox="0 0 640 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="pd-glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
  </defs>

  <rect x="1" y="1" width="638" height="398" rx="24" fill="#12161f" stroke="#252c3a" stroke-width="1.5" />

  <!-- protraktor / pomiar kata -->
  <g transform="translate(170 190)">
    <circle r="70" fill="#e5a13a" opacity="0.08" filter="url(#pd-glow)" />
    <path d="M -66 0 A 66 66 0 0 1 40 -53" stroke="#4a5164" stroke-width="1.4" fill="none" />
    <g stroke="#3c4353" stroke-width="1.4">
      <line x1="-66" y1="0" x2="-58" y2="0" />
      <line x1="-57" y1="-23" x2="-50" y2="-20" />
      <line x1="-33" y1="-42" x2="-28" y2="-36" />
      <line x1="0" y1="-52" x2="0" y2="-44" />
      <line x1="32" y1="-42" x2="27" y2="-36" />
    </g>
    <line x1="0" y1="0" x2="-66" y2="0" stroke="#e5a13a" stroke-width="2" />
    <line x1="0" y1="0" x2="28" y2="-60" stroke="#e5a13a" stroke-width="2" />
    <path d="M -22 0 A 22 22 0 0 1 -14 -17" stroke="#ffc169" stroke-width="1.6" fill="none" />
    <text x="-30" y="-2" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="#ffc169">38°</text>
    <circle cx="-66" cy="0" r="3.5" fill="#ffc169" />
    <circle cx="28" cy="-60" r="3.5" fill="#ffc169" />
  </g>

  <!-- male pierscienie w rogu -->
  <g transform="translate(520 90)" opacity="0.8">
    <circle r="46" stroke="#46c4b3" stroke-opacity="0.5" stroke-width="10" stroke-dasharray="14 8" />
    <circle r="26" stroke="#e5a13a" stroke-opacity="0.6" stroke-width="8" stroke-dasharray="10 6" transform="rotate(30)" />
  </g>

  <!-- sekwencja krokow -->
  <g font-family="IBM Plex Sans, sans-serif" font-size="14" fill="#8890a1">
    <line x1="120" y1="320" x2="500" y2="320" stroke="#2c3242" stroke-width="1.4" stroke-dasharray="1 8" />
    <circle cx="120" cy="320" r="10" fill="#1c2230" stroke="#7bdfd0" stroke-width="1.6" />
    <text x="116" y="325" fill="#7bdfd0" font-size="11">1</text>
    <circle cx="310" cy="320" r="10" fill="#1c2230" stroke="#ffc169" stroke-width="1.6" />
    <text x="306" y="325" fill="#ffc169" font-size="11">2</text>
    <circle cx="500" cy="320" r="10" fill="#1c2230" stroke="#eef1f6" stroke-width="1.6" />
    <text x="496" y="325" fill="#eef1f6" font-size="11">3</text>
  </g>
</svg>
