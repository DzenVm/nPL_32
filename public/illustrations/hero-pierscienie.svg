    <radialGradient id="rdzen-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3d9" />
      <stop offset="45%" stop-color="#e5a13a" />
      <stop offset="100%" stop-color="#e5a13a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <circle cx="300" cy="300" r="170" fill="#e5a13a" opacity="0.16" filter="url(#blur-duzy)" />
  <circle cx="300" cy="300" r="90" fill="#46c4b3" opacity="0.12" filter="url(#blur-duzy)" />

  <g opacity="0.5">
    <line x1="300" y1="40" x2="300" y2="120" stroke="#7bdfd0" stroke-width="1.5" stroke-dasharray="2 7" />
    <line x1="300" y1="480" x2="300" y2="560" stroke="#ffc169" stroke-width="1.5" stroke-dasharray="2 7" />
    <line x1="52" y1="300" x2="132" y2="300" stroke="#ffc169" stroke-width="1.5" stroke-dasharray="2 7" />
    <line x1="468" y1="300" x2="548" y2="300" stroke="#7bdfd0" stroke-width="1.5" stroke-dasharray="2 7" />
    <line x1="120" y1="120" x2="175" y2="175" stroke="#e5a13a" stroke-width="1.5" stroke-dasharray="2 7" />
    <line x1="480" y1="480" x2="425" y2="425" stroke="#46c4b3" stroke-width="1.5" stroke-dasharray="2 7" />
