  <circle cx="300" cy="300" r="250" stroke="#46c4b3" stroke-opacity="0.16" stroke-width="46" stroke-dasharray="104.7 52.4" transform="rotate(8 300 300)" />
  <circle cx="300" cy="300" r="190" stroke="#e5a13a" stroke-opacity="0.22" stroke-width="40" stroke-dasharray="99.5 49.7" transform="rotate(-14 300 300)" />
  <circle cx="300" cy="300" r="132" stroke="#7bdfd0" stroke-opacity="0.32" stroke-width="34" stroke-dasharray="78.9 39.5" transform="rotate(22 300 300)" />

  <circle cx="300" cy="300" r="250" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />
  <circle cx="300" cy="300" r="190" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1" />
  <circle cx="300" cy="300" r="132" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

  <circle cx="300" cy="300" r="58" fill="url(#rdzen-gradient)" />
  <circle cx="300" cy="300" r="7" fill="#fffaf0" filter="url(#blur-maly)" />
